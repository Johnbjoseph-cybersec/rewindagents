[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rewindagents"
dynamic = ["version"]
description = "Ctrl+Z for AI coding agents: record, replay and rewind every tool call."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["claude-code", "coding-agent", "undo", "checkpoint", "hash-chain", "replay"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.urls]
Source = "https://github.com/Johnbjoseph-cybersec/rewindagents"

[project.scripts]
rewindagents = "rewindagents.cli:main"

[tool.setuptools.dynamic]
version = {attr = "rewindagents.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
