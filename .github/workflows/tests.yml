# Runs the test suite on Linux, macOS and Windows. All three rows are equal: a failure on any of them fails the
# run (Windows went green on main in run 44275227200 and has been a normal row since 1.2.0; docs/windows.md).
# Actions are pinned to commit SHAs (the version tag is the comment). Read-only token.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            py: python3
          - os: macos-latest
            py: python3
          - os: windows-latest
            py: python
    runs-on: ${{ matrix.os }}
    # The suite takes about 1 min on Linux and 2 on macOS. Without a limit, a hung test holds the job for the
    # 6 h default and its log stays unreadable (run 43432945827, Windows); -v names the last test that started.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: ${{ matrix.py }} -m unittest discover -s tests -v
