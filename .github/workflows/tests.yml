# Runs the test suite on Linux, macOS and Windows. Windows is in the matrix so the README can say
# "supported" only once this job is green there; until then the README says Unix only.
# Actions are pinned to commit SHAs (the version tag is the comment). Read-only token.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            py: python3
          - os: macos-latest
            py: python3
          - os: windows-latest
            py: python
            experimental: true   # README: "Windows is not supported" until this job is green; it runs to show how far off
    runs-on: ${{ matrix.os }}
    # The suite takes about 1 min on Linux and 2 on macOS. Without a limit, a hung test holds the job for the
    # 6 h default and its log stays unreadable (run 43432945827, Windows); -v names the last test that started.
    timeout-minutes: 20
    # flip experimental off only after a green windows run is observed on main
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: ${{ matrix.py }} -m unittest discover -s tests -v
